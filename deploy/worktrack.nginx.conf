map $http_if_match $worktrack_if_match {
    default $http_if_match;
    '~^W/("[0-9]+")$' $1;
}
map $http_if_none_match $worktrack_if_none_match {
    default $http_if_none_match;
    '~^W/("[0-9]+")$' $1;
}
server {
    listen 127.0.0.1:3088;
    server_name work.gim.uy;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare compression can weaken an ETag. Revisions identify the
        # JSON document, independent of its transport compression.
        proxy_set_header If-Match $worktrack_if_match;
        proxy_set_header If-None-Match $worktrack_if_none_match;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-transform" always;
        proxy_cookie_flags worktrack_session secure httponly samesite=strict;
    }
}
